[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "resumelab"
description = "A research prototype for studying aggressive JD-conditioned resume transformation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chaitanya Gandhi" }]
keywords = ["research", "resume", "llm", "job-description", "usc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dynamic = ["version"]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "openai>=1.40",
    "anthropic>=0.69",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
    # Job posting retrieval. Already present transitively via both provider SDKs;
    # declared because `fetching/` imports it directly.
    "httpx>=0.27",
]

[project.scripts]
resumelab = "resumelab.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pypdf>=4.2",
]

[tool.hatch.version]
path = "src/resumelab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/resumelab"]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return consistency
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib over os.path
    "TID",  # tidy imports
    "ANN",  # type annotations
    "T20",  # flake8-print: no print() debugging
    "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests may use fixtures as unused-looking arguments and need no return annotations.
"tests/**/*.py" = ["ANN", "ARG"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# ReportLab ships no type information.
module = ["reportlab.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Tests that spend real money are opt-in: run them with `pytest -m e2e`.
    "-m",
    "not e2e",
    "--cov=resumelab",
    "--cov-report=term-missing",
]
markers = [
    "e2e: tests that perform real network/LLM calls (deselected by default)",
]

[tool.coverage.run]
branch = true
source = ["resumelab"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
